name: Guardian deterministic tests
on:
  push:
    branches: [agentops-guardian-hackathon-2026]
    paths:
      - "agentops-guardian/**"
      - ".github/workflows/guardian-tests.yml"
  pull_request:
    paths:
      - "agentops-guardian/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentops-guardian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - run: node --experimental-strip-types --test tests/diagnosis.test.mjs
